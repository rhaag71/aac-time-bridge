[platformio]
default_envs = nodemcu-32s

[env:nodemcu-32s]
platform = espressif32 @ 7.0.1
board = nodemcu-32s
framework = arduino
monitor_speed = 115200

; Explicitly build/flash this environment, then issue USB command wedge watchdog.
; Production contains neither the command nor the deliberate hang function.
[env:watchdog-bench]
extends = env:nodemcu-32s
build_flags = -DAAC_WATCHDOG_BENCH=1

; Timing instrumentation is compile-time isolated from production firmware.
; Variant A preserves Arduino-ESP32's default MIN_MODEM station power saving.
[env:ntp-timing-default]
extends = env:nodemcu-32s
build_flags = -DAAC_NTP_TIMING_DIAGNOSTICS=1

; Variant B changes only station modem sleep for the diagnostic comparison.
[env:ntp-timing-no-wifi-sleep]
extends = env:nodemcu-32s
build_flags = -DAAC_NTP_TIMING_DIAGNOSTICS=1 -DAAC_NTP_TIMING_DISABLE_WIFI_SLEEP=1
